<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 · 艺术家</title>
  <link rel="stylesheet" href="/assets/styles/admin.css">
</head>
<body>
  <div class="admin-layout">
    <!-- 侧边栏 -->
    <aside class="admin-sidebar">
      <div class="admin-sidebar-brand">
        <div class="brand-mark">A</div>
        <span>艺术家后台</span>
      </div>
      <a href="#" class="admin-nav-link active" data-tab="works">🎨 作品管理</a>
      <a href="#" class="admin-nav-link" data-tab="about">👤 艺术家资料</a>
      <a href="/" class="admin-nav-link" target="_blank">🌐 查看前台</a>
      <div class="admin-sidebar-footer">
        <a href="#" id="logout-btn" style="color:inherit;">退出登录 →</a>
      </div>
    </aside>

    <main class="admin-main">
      <!-- 作品管理 tab -->
      <section id="tab-works">
        <div class="admin-header">
          <h1>作品管理</h1>
          <div class="admin-header-actions">
            <button class="btn btn-primary" id="btn-new-artwork">＋ 新建作品</button>
          </div>
        </div>

        <div class="admin-toolbar">
          <input type="text" id="search-input" placeholder="搜索标题……">
          <select id="status-filter">
            <option value="all">全部状态</option>
            <option value="published">已上架</option>
            <option value="draft">未上架</option>
          </select>
          <button class="btn" id="btn-refresh">刷新</button>
        </div>

        <div id="artwork-list-container">
          <div class="admin-empty"><h3>加载中……</h3></div>
        </div>
      </section>

      <!-- 艺术家资料 tab -->
      <section id="tab-about" hidden>
        <div class="admin-header"><h1>艺术家资料</h1></div>
        <div class="upload-form">
          <form id="artist-form">
            <div class="field-row">
              <div class="field-group field">
                <label>中文名</label>
                <input type="text" name="name" required>
              </div>
              <div class="field-group field">
                <label>英文名</label>
                <input type="text" name="name_en">
              </div>
            </div>
            <div class="field-group field">
              <label>一句话简介（首页 Hero 用）</label>
              <input type="text" name="bio_short" placeholder="如：用色彩捕捉光与情绪">
            </div>
            <div class="field-group field">
              <label>完整简介</label>
              <textarea name="bio" rows="8" placeholder="教育背景、创作理念、参展经历等"></textarea>
            </div>
            <div class="field-group field">
              <label>头像 URL（可选）</label>
              <input type="url" name="avatar" placeholder="https://...">
            </div>
            <div class="field-row">
              <div class="field-group field">
                <label>联系 Email</label>
                <input type="email" name="contact_email">
              </div>
              <div class="field-group field">
                <label>联系 WeChat</label>
                <input type="text" name="contact_wechat">
              </div>
            </div>
            <div class="field-group field">
              <label>社交账号（每行一个：平台名,URL）</label>
              <textarea name="socials_text" rows="4" placeholder="Weibo,https://weibo.com/xxx&#10;Instagram,https://instagram.com/xxx&#10;小红书,https://xiaohongshu.com/xxx"></textarea>
            </div>
            <div style="display:flex;gap:12px;">
              <button type="submit" class="btn btn-primary">保存</button>
              <button type="button" class="btn" id="btn-reset-artist">重置</button>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>

  <!-- 新建/编辑作品 Modal -->
  <div class="modal-overlay" id="artwork-modal" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">新建作品</h2>
        <button class="modal-close" id="modal-close">×</button>
      </div>
      <form id="artwork-form" class="upload-form" style="border:none;padding:0;background:transparent;">
        <div class="field-group field">
          <label>作品标题 *</label>
          <input type="text" name="title" required placeholder="如：晨光中的花园">
        </div>

        <div class="field-row">
          <div class="field-group field">
            <label>URL Slug *</label>
            <input type="text" name="slug" required placeholder="morning-garden">
          </div>
          <div class="field-group field">
            <label>分类</label>
            <select name="category">
              <option value="oil">油画</option>
              <option value="watercolor">水彩</option>
              <option value="sketch">素描</option>
              <option value="ink">国画</option>
              <option value="digital">数字艺术</option>
              <option value="photograph">摄影</option>
              <option value="other">其他</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="field-group field">
            <label>年份 *</label>
            <input type="number" name="year" required min="1900" max="2100" value="2025">
          </div>
          <div class="field-group field">
            <label>排序权重（越大越靠前）</label>
            <input type="number" name="sort_order" value="0">
          </div>
        </div>

        <div class="field-row">
          <div class="field-group field">
            <label>媒介</label>
            <input type="text" name="medium" placeholder="如：布面油画">
          </div>
          <div class="field-group field">
            <label>尺寸</label>
            <input type="text" name="dimensions" placeholder="如：60 x 80 cm">
          </div>
        </div>

        <div class="field-group field">
          <label>作品简介</label>
          <textarea name="description" rows="4" placeholder="创作背景、灵感来源、技术细节……"></textarea>
        </div>

        <div class="field-group field">
          <label>图片 *</label>
          <div class="dropzone" id="dropzone">
            <p>📷 点击上传或拖拽图片到此处</p>
            <p style="font-size:12px;margin-top:6px;">支持 JPG / PNG / WebP / GIF，单张 ≤ 10MB</p>
            <input type="file" name="images" class="dropzone-input" id="file-input" multiple accept="image/*">
          </div>
          <div class="preview-list" id="preview-list"></div>
          <p style="font-size:12px;color:var(--color-text-secondary);margin-top:8px;" id="upload-status"></p>
        </div>

        <div class="field-row">
          <div class="field-group field">
            <label>上架状态</label>
            <select name="published">
              <option value="1">✅ 上架（公开可见）</option>
              <option value="0">🔒 下架（仅后台可见）</option>
            </select>
          </div>
          <div class="field-group field">
            <label>精选</label>
            <select name="featured">
              <option value="0">否</option>
              <option value="1">⭐ 是（首页精选）</option>
            </select>
          </div>
        </div>

        <div style="display:flex;gap:12px;margin-top:12px;">
          <button type="submit" class="btn btn-primary" id="btn-save-artwork">保存</button>
          <button type="button" class="btn" id="btn-cancel-artwork">取消</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast 容器 -->
  <div id="toast-container"></div>

  <script src="/assets/js/admin.js"></script>
</body>
</html>
