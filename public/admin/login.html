<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 艺术家后台</title>
  <link rel="stylesheet" href="/assets/styles/admin.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-brand">
        <div class="brand-mark">A</div>
        <div>
          <h1>艺术家后台</h1>
          <p>请登录以管理作品</p>
        </div>
      </div>

      <form id="login-form" class="login-form">
        <div class="field">
          <label for="username">登录名</label>
          <input type="text" id="username" name="username" required autofocus
                 autocomplete="username" value="admin" placeholder="请输入登录名">
        </div>
        <div class="field">
          <label for="password">密码</label>
          <input type="password" id="password" name="password"
                 autocomplete="current-password" placeholder="请输入密码（首次登录可留空）">
        </div>
        <button type="submit" class="btn-login" id="login-btn">登录</button>
        <p class="login-error" id="login-error"></p>
      </form>

      <a href="/" class="login-back">← 返回前台</a>
    </div>
  </div>

  <script>
    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errEl = document.getElementById('login-error');
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      btn.disabled = true;
      btn.textContent = '登录中...';
      errEl.textContent = '';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        });
        const data = await res.json();

        if (data.ok) {
          // 首次登录需强制改密
          if (data.data && data.data.must_change_password) {
            window.location.href = '/admin/?force_password_change=1';
            return;
          }
          // 跳转到管理主页
          const rawNext = new URLSearchParams(location.search).get('next') || '/admin/';
          let next = '/admin/';
          try {
            if (rawNext.startsWith('/') && !rawNext.startsWith('//') && !rawNext.includes('\\')) {
              const target = new URL(rawNext, location.origin);
              if (target.origin === location.origin) {
                next = target.pathname + target.search + target.hash;
              }
            }
          } catch (e) {}
          window.location.href = next;
        } else {
          errEl.textContent = data.message || '登录名或密码错误';
          btn.disabled = false;
          btn.textContent = '登录';
        }
      } catch (err) {
        errEl.textContent = '网络错误，请稍后重试';
        btn.disabled = false;
        btn.textContent = '登录';
      }
    });
  </script>
</body>
</html>
